 <main class="resume">
  <app-header
    [fullName]="fullName"
    [location]="location"
    [email]="email"
    [phone]="phone"
    [profile]="profile" />

  <section class="education">
    <h2>Education</h2>
    @for (item of education; track item.school) {
      <div class="education-item">
        <h3>{{ item.school }}</h3>
        <p>{{ item.degree }}</p>
        <p>{{ item.specialization }}</p>
        <span>{{ item.year }}</span>
      </div>
  }
</section>

    <app-profile-card />

  <!--
    <section>
    <h2>Key Skills</h2>
    <ul>
      @for (skill of skills; track skill) {
        <li>{{ skill }}</li>
      }
    </ul>
  </section>
  -->

  <app-skills
    [skills]="skills"
    (skillSelected)="onSkillSelected($event)" />

    <section>
    <h2>Interests</h2>
    <ul>
      @for (interest of interests; track interest) {
        <li>{{ interest }}</li>
      }
    </ul>
  </section>

  <section class="interaction">
    <h2 class="section-title">Angular Interaction</h2>
    <p>{{ message }}</p>
  </section>

  <app-footer
    [fullName]="fullName"
    [proficiencies]="proficiencies" />

</main>
